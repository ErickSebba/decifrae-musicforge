[package]
name = "decifrae-musicforge"
version = "0.1.0"
description = "Decifrae MusicForge — app de estudo de baixo elétrico"
authors = ["ErickSebba"]
edition = "2021"

[lib]
# Unique lib name required on Windows — see https://github.com/rust-lang/cargo/issues/8519
name = "decifrae_musicforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

